# Application Properties
spring.application.name=pet-store

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pet_store?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Schema init — managed manually for app, auto for tests (see application-test.properties)
spring.sql.init.mode=never

# Google OAuth
google.client-id=1043487308280-rfe3nmcb1avbkv7n7eg5ved64vji0tfp.apps.googleusercontent.com

# Goong Maps
goong.maps.api-key=BgK1d9exfvbGeQdUAnCqEYCzcyl1Sso780fdEiNy
goong.maps.base-url=https://rsapi.goong.io

# Logging
logging.level.root=WARN
logging.level.hcmuaf.sad.pet_store=INFO
logging.level.org.springframework.jdbc.core=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{25}){cyan} : %msg%n


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Custom Application Config
app.store.address=Đại học Nông Lâm, Khu phố 6, Linh Trung, Thủ Đức, TP.HCM