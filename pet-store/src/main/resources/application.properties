# Application Properties
spring.application.name=pet-store

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pet_store?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Log SQL ra console
logging.level.org.springframework.jdbc.core=DEBUG

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# Custom Application Config
app.store.address=Đại học Nông Lâm, Khu phố 6, Linh Trung, Thủ Đức, TP.HCM
app.google.maps.api-key=DUMMY_API_KEY