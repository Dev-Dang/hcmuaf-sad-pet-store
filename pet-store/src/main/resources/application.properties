# Application Properties
spring.application.name=pet-store

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pet_store?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Schema init — managed manually for app, auto for tests (see application-test.properties)
spring.sql.init.mode=never

# Logging
logging.level.root=WARN
logging.level.hcmuaf.sad.pet_store=INFO
logging.level.org.springframework.jdbc.core=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{25}){cyan} : %msg%n