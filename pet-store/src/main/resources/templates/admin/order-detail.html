<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết đơn hàng (Admin) - Pet Store</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: adminHeader('orders')}"></header>

<main class="page stack" id="detail-container">
    <div class="panel">⏳ Đang tải thông tin đơn hàng...</div>
</main>

<script th:inline="javascript">
    const orderId = /*[[${orderId}]]*/ null;
    const fmt = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);

    async function loadOrderDetail() {
        if (!orderId) return;
        try {
            const res = await fetch(`/api/v1/admin/orders/${orderId}`);
            const data = await res.json();
            if (data.success) {
                renderOrder(data.data);
            } else {
                document.getElementById('detail-container').innerHTML =
                    `<div class="panel">❌ ${data.message}</div>`;
            }
        } catch (e) {
            document.getElementById('detail-container').innerHTML =
                `<div class="panel">❌ Không thể tải chi tiết đơn hàng</div>`;
        }
    }

    function renderOrder(o) {
        document.getElementById('detail-container').innerHTML = `
            <div class="actions">
                <h1>Chi tiết đơn hàng #${o.orderCode}</h1>
                <a class="button secondary" href="/admin/orders">Quay lại</a>
            </div>

            <section class="panel detail-grid">
                <div>
                    <span class="muted">Khách hàng</span>
                    <strong>${o.customerName || ''}</strong>
                </div>
                <div>
                    <span class="muted">Email</span>
                    <strong>${o.customerEmail || ''}</strong>
                </div>
                <div>
                    <span class="muted">Người nhận</span>
                    <strong>${o.recipientName || ''}</strong>
                </div>
                <div>
                    <span class="muted">SĐT</span>
                    <strong>${o.recipientPhone || ''}</strong>
                </div>
                <div class="detail-wide">
                    <span class="muted">Địa chỉ</span>
                    <strong>${o.deliveryAddress || ''}</strong>
                </div>
                <div>
                    <span class="muted">Trạng thái đơn</span>
                    <strong>${o.orderStatusLabel || o.orderStatus || ''}</strong>
                </div>
                <div>
                    <span class="muted">Thanh toán</span>
                    <strong>${o.paymentStatusLabel || o.paymentStatus || ''}</strong>
                </div>
                <div>
                    <span class="muted">Phương thức</span>
                    <strong>${o.paymentMethod || ''}</strong>
                </div>
                <div>
                    <span class="muted">Ngày tạo</span>
                    <strong>${new Date(o.createdAt).toLocaleString()}</strong>
                </div>
                <div>
                    <span class="muted">Tạm tính</span>
                    <strong>${fmt(o.subtotal)}</strong>
                </div>
                <div>
                    <span class="muted">Phí ship</span>
                    <strong>${fmt(o.shippingFee)}</strong>
                </div>
                <div>
                    <span class="muted">Tổng tiền</span>
                    <strong>${fmt(o.totalAmount)}</strong>
                </div>
                <div class="detail-wide">
                    <span class="muted">Ghi chú</span>
                    <strong>${o.note || 'Không có'}</strong>
                </div>
            </section>

            <section class="panel">
                <h2>Danh sách sản phẩm</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Phân loại</th>
                            <th>Đơn giá</th>
                            <th>SL</th>
                            <th>Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${(o.items || []).map(i => `
                            <tr>
                                <td>${i.productName}</td>
                                <td>${i.variantName || 'Mặc định'}</td>
                                <td>${fmt(i.unitPrice)}</td>
                                <td>${i.quantity}</td>
                                <td>${fmt(i.subtotal)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </section>
        `;
    }

    loadOrderDetail();
</script>
</body>
</html>
