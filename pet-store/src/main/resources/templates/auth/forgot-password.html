<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css(v=20260703)}">
</head>
<body>
<header th:replace="~{fragments/navigation :: customerHeader('')}"></header>

<main class="auth-page">
<section class="auth-panel">
<h1>Quên mật khẩu</h1>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/auth/forgot-password}" th:object="${resetPasswordRequest}" method="post">
    <div class="form-field">
        <label>Email</label>
        <input type="email" th:field="*{email}">
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </div>
    <div class="actions">
        <button type="submit">Gửi mã OTP</button>
    </div>
</form>

<p>Đã nhớ mật khẩu? <a th:href="@{/auth/login}">Đăng nhập</a></p>
</section>
</main>
</body>
</html>
