<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác thực OTP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css(v=20260703)}">
</head>
<body>
<header th:replace="~{fragments/navigation :: customerHeader('')}"></header>

<main class="auth-page">
<section class="auth-panel">
<h1>Xác thực OTP</h1>

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/auth/otp/verify}" th:object="${otpRequest}" method="post">
    <input type="hidden" name="challengeId" th:value="${challengeId}">
    <div class="form-field">
        <label>Mã OTP</label>
        <input type="text" th:field="*{otp}" inputmode="numeric" maxlength="6">
        <span class="field-error" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></span>
        <span class="field-error" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></span>
    </div>
    <div class="actions">
        <button type="submit">Xác thực</button>
    </div>
</form>

<form th:action="@{/auth/otp/resend}" method="post">
    <input type="hidden" name="challengeId" th:value="${challengeId}">
    <p th:if="${resendRemainingSeconds != null && resendRemainingSeconds > 0}">
        Có thể gửi lại sau: <span id="resendCountdown" th:data-seconds="${resendRemainingSeconds}" th:text="${resendRemainingText}">01:00</span>
    </p>
    <button id="resendButton" type="submit" th:disabled="${resendRemainingSeconds != null && resendRemainingSeconds > 0}">Gửi lại OTP</button>
</form>

<p><a th:href="@{/auth/forgot-password}">Bắt đầu lại</a></p>
</section>
</main>
<script>
const countdown = document.getElementById('resendCountdown');
const resendButton = document.getElementById('resendButton');

if (countdown) {
    let remaining = Number(countdown.dataset.seconds || 0);

    function renderCountdown() {
        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;
        countdown.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        if (remaining <= 0) {
            if (resendButton) {
                resendButton.disabled = false;
            }
            countdown.closest('p').style.display = 'none';
            return;
        }
        remaining -= 1;
        setTimeout(renderCountdown, 1000);
    }

    renderCountdown();
}
</script>
</body>
</html>
