<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css(v=20260703)}">
</head>
<body>
<header th:replace="~{fragments/navigation :: customerHeader('')}"></header>

<main class="auth-page">
<section class="auth-panel">
<h1>Đặt lại mật khẩu</h1>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/auth/reset-password}" th:object="${newPasswordRequest}" method="post">
    <input type="hidden" th:field="*{challengeId}">
    <div class="form-field">
        <label>Mật khẩu mới</label>
        <input type="password" th:field="*{newPassword}">
        <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        <span class="field-error" th:if="${#fields.hasErrors('challengeId')}" th:errors="*{challengeId}"></span>
    </div>
    <div class="actions">
        <button type="submit">Cập nhật mật khẩu</button>
    </div>
</form>
</section>
</main>
</body>
</html>
