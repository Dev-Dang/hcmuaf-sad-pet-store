<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lỗi</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}">Pet Store</a>
        <nav class="nav">
            <a th:href="@{/}">Trang chủ</a>
        </nav>
    </div>
</header>

<main class="page">
    <section class="panel">
        <h1>Đã xảy ra lỗi</h1>
        <p th:text="${errorMessage}">Có lỗi xảy ra. Vui lòng thử lại.</p>
        <a class="button secondary" th:href="@{/}">Quay về trang chủ</a>
    </section>
</main>
</body>
</html>
