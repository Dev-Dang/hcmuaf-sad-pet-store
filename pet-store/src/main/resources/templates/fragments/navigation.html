<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="adminHeader(activePage)" class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/admin/}">Pet Store Admin</a>
        <nav class="nav">
            <a th:classappend="${activePage == 'customers'} ? ' active' : ''" th:href="@{/admin/customers}">Khách hàng</a>
            <a th:classappend="${activePage == 'orders'} ? ' active' : ''" th:href="@{/admin/orders}">Đơn hàng</a>
            <a th:classappend="${activePage == 'products'} ? ' active' : ''" th:href="@{/products}">Sản phẩm</a>
            <a th:classappend="${activePage == 'menu'} ? ' active' : ''" th:href="@{/admin/}">Menu</a>
            <form class="inline-form" th:action="@{/logout}" method="post">
                <button class="secondary" type="submit">Đăng xuất</button>
            </form>
        </nav>
    </div>
</header>

<header th:fragment="customerHeader(activePage)" class="topbar customer-topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/products}">Pet Store</a>
        <nav class="nav">
            <a th:classappend="${activePage == 'products'} ? ' active' : ''" th:href="@{/products}">Sản phẩm</a>
            <th:block th:if="${session.currentUser != null}">
                <a th:classappend="${activePage == 'cart'} ? ' active' : ''" th:href="@{/cart}">
                    Giỏ hàng <span class="cart-badge" id="cart-count" style="display:none">0</span>
                </a>
                <a th:classappend="${activePage == 'orders'} ? ' active' : ''" th:href="@{/orders}">Đơn hàng</a>
                <a th:classappend="${activePage == 'addresses'} ? ' active' : ''" th:href="@{/account/addresses}">Địa chỉ</a>
                <a th:classappend="${activePage == 'account'} ? ' active' : ''" th:href="@{/account}">
                    <span th:text="${session.currentUser.displayName}">Tài khoản</span>
                </a>
                <form class="inline-form" th:action="@{/logout}" method="post">
                    <button class="secondary" type="submit">Đăng xuất</button>
                </form>
            </th:block>
            <th:block th:unless="${session.currentUser != null}">
                <a th:href="@{/auth/login}">Đăng nhập</a>
                <a th:href="@{/auth/register}">Đăng ký</a>
            </th:block>
        </nav>
    </div>
</header>
</body>
</html>
