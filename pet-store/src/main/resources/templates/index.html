<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pet Store</title>
</head>
<body>
<h1>Chào mừng đến Pet Store</h1>
<p>HCMUAF - System Analysis and Design (SAD) Project</p>

<div th:if="${session.currentUser != null}">
    <p>Xin chào, <strong th:text="${session.currentUser.displayName}"></strong>!</p>
    <a th:href="@{/auth/logout}">Đăng xuất</a>
</div>
<div th:unless="${session.currentUser != null}">
    <a th:href="@{/auth/login}">Đăng nhập</a> |
    <a th:href="@{/auth/register}">Đăng ký</a>
</div>
</body>
</html>
