<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết đơn hàng - Pet Store</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🐾 PetStore</div>
    <div class="nav-links">
        <a href="/products">Sản phẩm</a>
        <a href="/cart" class="cart-icon">🛒 Giỏ hàng <span class="badge" id="cart-count" style="display:none">0</span></a>
        <a href="/orders" class="active">📦 Đơn hàng</a>
        <a href="/logout" sec:authorize="isAuthenticated()">Đăng xuất</a>
    </div>
</nav>

<div class="page-container" id="detail-container">
    <div class="loading-state">⏳ Đang tải thông tin đơn hàng...</div>
</div>

<script th:inline="javascript">
    const orderId = /*[[${orderId}]]*/ null;
    const fmt = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);

    async function loadOrderDetail() {
        if (!orderId) return;
        try {
            const res = await fetch(`/api/v1/orders/me/${orderId}`);
            const data = await res.json();
            if (data.success) {
                renderOrder(data.data);
            } else {
                document.getElementById('detail-container').innerHTML = 
                    `<div class="loading-state">❌ ${data.message}</div>`;
            }
        } catch (e) {
            document.getElementById('detail-container').innerHTML = 
                `<div class="loading-state">❌ Không thể tải chi tiết đơn hàng</div>`;
        }
    }

    function renderOrder(o) {
        const html = `
            <div class="breadcrumb">
                <a href="/orders">Đơn hàng</a> / <span>Chi tiết #${o.id}</span>
            </div>
            
            <div class="product-detail-card" style="display: block;">
                <h2 style="margin-bottom: 1.5rem;">Chi tiết Đơn hàng #${o.id}</h2>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                    <div>
                        <h3 class="section-title">Thông tin giao hàng</h3>
                        <p><strong>Người nhận:</strong> ${o.recipientName}</p>
                        <p><strong>Điện thoại:</strong> ${o.recipientPhone}</p>
                        <p><strong>Địa chỉ:</strong> ${o.deliveryAddress}</p>
                        <p><strong>Ghi chú:</strong> ${o.note || 'Không'}</p>
                    </div>
                    <div>
                        <h3 class="section-title">Trạng thái</h3>
                        <p><strong>Ngày đặt:</strong> ${new Date(o.createdAt).toLocaleString()}</p>
                        <p><strong>Đơn hàng:</strong> <span class="v-stock">${o.orderStatusLabel}</span></p>
                        <p><strong>Thanh toán:</strong> <span class="out-of-stock-badge" style="background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color);">${o.paymentStatusLabel}</span></p>
                        <p><strong>Phương thức TT:</strong> ${o.paymentMethod}</p>
                    </div>
                </div>

                <h3 class="section-title">Sản phẩm đã đặt</h3>
                <div class="cart-items" style="margin-bottom: 2rem;">
                    ${o.items.map(i => `
                        <div class="cart-item" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 1rem;">
                            <div class="ci-info" style="flex: 1;">
                                <div class="ci-name">${i.productName}</div>
                                <div class="ci-variant">${i.variantName || 'Mặc định'}</div>
                            </div>
                            <div class="ci-price" style="width: 150px; text-align: right;">${fmt(i.unitPrice)} x ${i.quantity}</div>
                            <div class="ci-subtotal" style="width: 150px; text-align: right; color: var(--primary-color); font-weight: 600;">${fmt(i.subtotal)}</div>
                        </div>
                    `).join('')}
                </div>

                <div style="width: 300px; margin-left: auto;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color: var(--text-secondary);">Tạm tính:</span>
                        <span>${fmt(o.subtotal)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color: var(--text-secondary);">Phí vận chuyển:</span>
                        <span>${fmt(o.shippingFee)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); font-weight: 600; font-size: 1.2rem; color: var(--primary-color);">
                        <span>Tổng thanh toán:</span>
                        <span>${fmt(o.totalAmount)}</span>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('detail-container').innerHTML = html;
    }

    async function updateCartCount() {
        try {
            const res = await fetch('/api/v1/cart');
            const data = await res.json();
            if (data.success) {
                const count = (data.data.items || []).length;
                const badge = document.getElementById('cart-count');
                badge.textContent = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            }
        } catch (e) {}
    }

    updateCartCount();
    loadOrderDetail();
</script>
</body>
</html>
