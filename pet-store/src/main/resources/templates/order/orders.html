<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - Pet Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: customerHeader('orders')}"></header>

<div class="page-container">
    <h1 class="page-title">Đơn hàng của tôi</h1>
    <p class="page-subtitle">Theo dõi lịch sử và trạng thái đơn hàng của bạn</p>
    <div id="orders-list">
        <div class="state-box">⏳ Đang tải danh sách đơn hàng...</div>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<script>
    const fmt = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);
    let currentPage = 0;

    async function loadOrders() {
        const container = document.getElementById('orders-list');
        try {
            const res = await fetch(`/api/v1/orders/me?page=${currentPage}&size=5`);
            const data = await res.json();
            if (data.success) {
                renderOrders(data.data);
            } else {
                container.innerHTML = `<div class="state-box">❌ Lỗi: ${data.message}</div>`;
            }
        } catch (e) {
            container.innerHTML = '<div class="state-box">❌ Không thể tải đơn hàng</div>';
        }
    }

    function renderOrders(page) {
        const container = document.getElementById('orders-list');
        const orders = page.content || [];

        if (orders.length === 0) {
            container.innerHTML = '<div class="state-box">📦 Bạn chưa có đơn hàng nào.</div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        container.innerHTML = orders.map(o => `
            <div class="product-detail-card" style="margin-bottom: 1.5rem;">
                <div style="display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid #edf0f4; padding-bottom: 1rem; margin-bottom: 1rem;">
                    <div>
                        <div style="color: #6b7280; font-size: 0.9rem;">Ngày đặt: ${new Date(o.createdAt).toLocaleString()}</div>
                        <h3 style="margin: 8px 0 0;">Đơn hàng #${o.id}</h3>
                    </div>
                    <div style="text-align: right;">
                        <span class="v-stock" style="margin-bottom: 0.5rem; display: inline-block;">Trạng thái: ${o.orderStatusLabel}</span>
                        <br>
                        <span class="out-of-stock-badge" style="background: #fff; color: #1a1a2e; border: 1px solid #d9dee5;">Thanh toán: ${o.paymentStatusLabel}</span>
                    </div>
                </div>
                
                ${o.items.map(i => `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <div>
                            <span>${i.productName} ${i.variantName ? ' - ' + i.variantName : ''}</span>
                            <span style="color: #6b7280; font-size: 0.9rem;">x ${i.quantity}</span>
                        </div>
                        <div style="font-size: 1.1rem; color: #0f766e; font-weight: 600;">${fmt(i.subtotal)}</div>
                    </div>
                `).join('')}
                
                <div style="display: flex; justify-content: space-between; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
                    <div style="color: #6b7280;">Tổng thanh toán:</div>
                    <div style="font-size: 1.3rem; color: #0f766e; font-weight: 700;">${fmt(o.totalAmount)}</div>
                </div>
                
                <div style="margin-top: 1rem; text-align: right;">
                    <a href="/orders/${o.id}" class="btn-add-cart" style="display: inline-block; width: auto; padding: 0.5rem 1.5rem;">Xem chi tiết</a>
                </div>
            </div>
        `).join('');

        renderPagination(page);
    }

    function renderPagination(page) {
        const el = document.getElementById('pagination');
        const total = page.totalPages || 1;
        if (total <= 1) { el.innerHTML = ''; return; }
        let html = `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>‹</button>`;
        for (let i = 0; i < total; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i + 1}</button>`;
        }
        html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage >= total - 1 ? 'disabled' : ''}>›</button>`;
        el.innerHTML = html;
    }

    function changePage(p) {
        currentPage = p;
        loadOrders();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function updateCartCount() {
        try {
            const res = await fetch('/api/v1/cart');
            const data = await res.json();
            if (data.success) {
                const count = (data.data.items || []).length;
                const badge = document.getElementById('cart-count');
                badge.textContent = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            }
        } catch (e) {}
    }

    updateCartCount();
    loadOrders();
</script>
</body>
</html>
