<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Pet Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>

<header th:replace="~{fragments/navigation :: customerHeader('products')}"></header>

<div class="page-container product-detail-page" id="detail-container">
    <div class="loading-state">⏳ Đang tải thông tin sản phẩm...</div>
</div>

<div class="toast" id="toast"></div>

<!-- Lấy ID từ Controller Model -->
<script th:inline="javascript">
    const productId = /*[[${productId}]]*/ null;
    const isAuthenticated = /*[[${session.currentUser != null}]]*/ false;
    const icons = ['🐶','🐱','🐠','🐹','🦜','🐰','🦴','🐾','🐕','🐈','🦎','🐇'];
    const fmt = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);

    let currentProduct = null;
    let selectedVariantId = null;

    async function loadProductDetail() {
        if (!productId) return;
        try {
            const res = await fetch(`/api/v1/products/${productId}`);
            const data = await res.json();
            if (data.success) {
                currentProduct = data.data;
                renderProduct();
            } else {
                document.getElementById('detail-container').innerHTML = 
                    `<div class="loading-state">❌ Không tìm thấy sản phẩm hoặc sản phẩm đã ngừng kinh doanh.</div>`;
            }
        } catch (e) {
            document.getElementById('detail-container').innerHTML = 
                `<div class="loading-state">❌ Lỗi kết nối.</div>`;
        }
    }

    function renderProduct() {
        const p = currentProduct;
        const variants = p.variants || [];
        
        let variantsHtml = '';
        if (variants.length === 0) {
            variantsHtml = `<div style="color:#9ca3af; font-style:italic">Hiện không có phân loại nào được bán.</div>`;
        } else {
            variantsHtml = variants.map(v => {
                const isOutOfStock = v.availableStock <= 0;
                return `
                <div class="variant-card ${isOutOfStock ? 'disabled' : ''}" 
                     id="var-${v.id}" 
                     onclick="${!isOutOfStock ? `selectVariant(${v.id})` : ''}">
                    <div class="variant-info-left">
                        <span class="v-name">${v.name || 'Mặc định'}</span>
                        ${isOutOfStock 
                            ? `<span class="v-stock out-of-stock-badge">Hết hàng</span>` 
                            : `<span class="v-stock">Còn ${v.availableStock} sản phẩm</span>`}
                    </div>
                    <div class="v-price">${fmt(v.price)}</div>
                </div>
                `;
            }).join('');
        }

        const html = `
            <div class="breadcrumb">
                <a href="/products">Sản phẩm</a> / <span>${p.name}</span>
            </div>
            <div class="product-detail-card">
                <div class="product-image-container">
                    ${icons[p.id % icons.length]}
                </div>
                <div class="product-info">
                    <span class="product-category">${p.categoryName || 'Sản phẩm thú cưng'}</span>
                    <h1 class="product-title">${p.name}</h1>
                    <p class="product-desc">${p.description}</p>
                    
                    <div class="section-title">Chọn phân loại:</div>
                    <div class="variant-grid">
                        ${variantsHtml}
                    </div>

                    <div class="add-to-cart-bar">
                        <input type="number" id="qty-input" class="qty-input" value="1" min="1" ${variants.length===0 ? 'disabled':''}>
                        <button class="btn-add-cart" id="btn-add-cart" onclick="addToCart()" disabled>
                            Chọn phân loại
                        </button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('detail-container').innerHTML = html;

        // Auto select first available variant
        const firstAvailable = variants.find(v => v.availableStock > 0);
        if (firstAvailable) {
            selectVariant(firstAvailable.id);
        } else if (variants.length > 0) {
            const btn = document.getElementById('btn-add-cart');
            btn.textContent = 'Hết hàng';
            btn.disabled = true;
        }
        
        updateCartCount();
    }

    function selectVariant(id) {
        selectedVariantId = id;
        document.querySelectorAll('.variant-card').forEach(c => c.classList.remove('active'));
        document.getElementById('var-' + id).classList.add('active');
        
        const btn = document.getElementById('btn-add-cart');
        btn.disabled = false;
        btn.textContent = '🛒 Thêm vào giỏ hàng';
    }

    async function addToCart() {
        if (!selectedVariantId) return;
        if (!isAuthenticated) {
            showToast('⚠️ Vui lòng đăng nhập để thêm vào giỏ hàng', 'error');
            setTimeout(() => window.location.href = '/auth/login', 1500);
            return;
        }

        const qty = parseInt(document.getElementById('qty-input').value) || 1;
        const btn = document.getElementById('btn-add-cart');
        btn.disabled = true;
        btn.textContent = 'Đang thêm...';

        try {
            const res = await fetch('/api/v1/cart/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ variantId: selectedVariantId, quantity: qty })
            });
            const data = await res.json();
            if (data.success) {
                showToast(`✅ Đã thêm vào giỏ hàng!`, 'success');
                updateCartCount();
                // Optionally reload to update stock numbers locally
                loadProductDetail();
            } else {
                showToast('❌ ' + (data.message || 'Không thể thêm vào giỏ'), 'error');
            }
        } catch (e) {
            showToast('❌ Lỗi kết nối', 'error');
        }
        
        btn.disabled = false;
        btn.textContent = '🛒 Thêm vào giỏ hàng';
    }

    async function updateCartCount() {
        if (!isAuthenticated) return;
        try {
            const res = await fetch('/api/v1/cart');
            const data = await res.json();
            if (data.success) {
                const count = (data.data.items || []).length;
                const badge = document.getElementById('cart-count');
                badge.textContent = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            }
        } catch (e) {}
    }

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + type;
        setTimeout(() => t.className = 'toast', 3000);
    }

    loadProductDetail();
</script>
</body>
</html>
