<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Pet Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fb; color: #1a1a2e; }

        /* ── Navbar ── */
        .navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            position: sticky; top: 0; z-index: 100;
        }
        .navbar-brand { font-size: 1.4rem; font-weight: 700; color: #e2b96f; text-decoration: none; }
        .navbar-brand span { color: #fff; }
        .navbar-nav { display: flex; align-items: center; gap: 1rem; }
        .nav-link { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.875rem; font-weight: 500; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { color: #fff; background: rgba(255,255,255,0.1); }
        .btn-logout { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-family: inherit; transition: all 0.2s; }
        .btn-logout:hover { background: rgba(255,255,255,0.2); }

        /* ── Cart Badge ── */
        .cart-link { position: relative; }
        .cart-badge { position: absolute; top: -6px; right: -6px; background: #e2b96f; color: #1a1a2e; font-size: 0.65rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* ── Page Content ── */
        .page-container { max-width: 1000px; margin: 3rem auto; padding: 0 1.5rem; }
        .breadcrumb { font-size: 0.9rem; color: #6b7280; margin-bottom: 2rem; }
        .breadcrumb a { color: #e2b96f; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .product-detail-card {
            background: #fff; border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: 400px 1fr;
            overflow: hidden;
        }
        @media (max-width: 768px) { .product-detail-card { grid-template-columns: 1fr; } }

        .product-image-container {
            background: linear-gradient(135deg, #f3f4f6 0%, #e9ecef 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem; min-height: 400px;
        }

        .product-info { padding: 2.5rem; }
        .product-title { font-size: 2rem; font-weight: 700; color: #1a1a2e; margin-bottom: 0.5rem; line-height: 1.2; }
        .product-category { display: inline-block; background: #f3f4f6; color: #4b5563; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1.5rem; }
        .product-desc { font-size: 0.95rem; color: #6b7280; line-height: 1.6; margin-bottom: 2rem; }

        .section-title { font-weight: 700; font-size: 1rem; color: #1a1a2e; margin-bottom: 1rem; }

        /* ── Variants ── */
        .variant-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-bottom: 2rem; }
        .variant-card {
            border: 2px solid #e5e7eb; border-radius: 10px;
            padding: 1rem; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .variant-card:hover:not(.disabled) { border-color: #cbd5e1; }
        .variant-card.active { border-color: #e2b96f; background: rgba(226, 185, 111, 0.05); }
        .variant-card.disabled { opacity: 0.5; cursor: not-allowed; background: #f9f9fb; }
        
        .variant-info-left { display: flex; flex-direction: column; }
        .v-name { font-weight: 600; font-size: 0.95rem; color: #1a1a2e; }
        .v-stock { font-size: 0.8rem; color: #6b7280; margin-top: 0.25rem; }
        .v-price { font-weight: 700; font-size: 1.1rem; color: #e2b96f; }
        
        .out-of-stock-badge { background: #fee2e2; color: #dc2626; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }

        /* ── Action ── */
        .add-to-cart-bar { display: flex; gap: 1rem; align-items: center; }
        .qty-input {
            width: 80px; height: 48px; border: 2px solid #e5e7eb; border-radius: 8px;
            text-align: center; font-size: 1.1rem; font-weight: 600; outline: none; transition: border-color 0.2s;
        }
        .qty-input:focus { border-color: #e2b96f; }
        
        .btn-add-cart {
            flex: 1; height: 48px; background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #e2b96f; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(26,26,46,0.2);
        }
        .btn-add-cart:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(26,26,46,0.3); }
        .btn-add-cart:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; background: #9ca3af; color: #fff; }

        /* ── Loading ── */
        .loading-state { text-align: center; padding: 5rem 0; font-size: 1.2rem; color: #6b7280; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: #1a1a2e; color: #fff;
            padding: 0.85rem 1.25rem; border-radius: 10px;
            font-size: 0.875rem; font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #dc2626; }
        .toast.success { background: #16a34a; }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}"><span>🐾 Pet</span>Store</a>
    <div class="navbar-nav">
        <a class="nav-link active" th:href="@{/products}">Sản phẩm</a>
        <a class="nav-link cart-link" th:href="@{/cart}">
            🛒 Giỏ hàng
            <span class="cart-badge" id="cart-count" style="display:none">0</span>
        </a>
        <span style="color:rgba(255,255,255,0.5); font-size:0.85rem;" sec:authorize="isAuthenticated()">
            Xin chào, <strong style="color:#e2b96f" sec:authentication="name">User</strong>
        </span>
        <form th:action="@{/logout}" method="post" style="margin:0;" sec:authorize="isAuthenticated()">
            <button type="submit" class="btn-logout">Đăng xuất</button>
        </form>
        <a th:href="@{/login}" class="nav-link" sec:authorize="!isAuthenticated()">Đăng nhập</a>
    </div>
</nav>

<div class="page-container" id="detail-container">
    <div class="loading-state">⏳ Đang tải thông tin sản phẩm...</div>
</div>

<div class="toast" id="toast"></div>

<!-- Lấy ID từ Controller Model -->
<script th:inline="javascript">
    const productId = /*[[${productId}]]*/ null;
    const isAuthenticated = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;
    const icons = ['🐶','🐱','🐠','🐹','🦜','🐰','🦴','🐾','🐕','🐈','🦎','🐇'];
    const fmt = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);

    let currentProduct = null;
    let selectedVariantId = null;

    async function loadProductDetail() {
        if (!productId) return;
        try {
            const res = await fetch(`/api/v1/products/${productId}`);
            const data = await res.json();
            if (data.success) {
                currentProduct = data.data;
                renderProduct();
            } else {
                document.getElementById('detail-container').innerHTML = 
                    `<div class="loading-state">❌ Không tìm thấy sản phẩm hoặc sản phẩm đã ngừng kinh doanh.</div>`;
            }
        } catch (e) {
            document.getElementById('detail-container').innerHTML = 
                `<div class="loading-state">❌ Lỗi kết nối.</div>`;
        }
    }

    function renderProduct() {
        const p = currentProduct;
        const variants = p.variants || [];
        
        let variantsHtml = '';
        if (variants.length === 0) {
            variantsHtml = `<div style="color:#9ca3af; font-style:italic">Hiện không có phân loại nào được bán.</div>`;
        } else {
            variantsHtml = variants.map(v => {
                const isOutOfStock = v.availableStock <= 0;
                return `
                <div class="variant-card ${isOutOfStock ? 'disabled' : ''}" 
                     id="var-${v.id}" 
                     onclick="${!isOutOfStock ? `selectVariant(${v.id})` : ''}">
                    <div class="variant-info-left">
                        <span class="v-name">${v.name || 'Mặc định'}</span>
                        ${isOutOfStock 
                            ? `<span class="v-stock out-of-stock-badge">Hết hàng</span>` 
                            : `<span class="v-stock">Còn ${v.availableStock} sản phẩm</span>`}
                    </div>
                    <div class="v-price">${fmt(v.price)}</div>
                </div>
                `;
            }).join('');
        }

        const html = `
            <div class="breadcrumb">
                <a href="/products">Sản phẩm</a> / <span>${p.name}</span>
            </div>
            <div class="product-detail-card">
                <div class="product-image-container">
                    ${icons[p.id % icons.length]}
                </div>
                <div class="product-info">
                    <span class="product-category">${p.categoryName || 'Sản phẩm thú cưng'}</span>
                    <h1 class="product-title">${p.name}</h1>
                    <p class="product-desc">${p.description}</p>
                    
                    <div class="section-title">Chọn phân loại:</div>
                    <div class="variant-grid">
                        ${variantsHtml}
                    </div>

                    <div class="add-to-cart-bar">
                        <input type="number" id="qty-input" class="qty-input" value="1" min="1" ${variants.length===0 ? 'disabled':''}>
                        <button class="btn-add-cart" id="btn-add-cart" onclick="addToCart()" disabled>
                            Chọn phân loại
                        </button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('detail-container').innerHTML = html;

        // Auto select first available variant
        const firstAvailable = variants.find(v => v.availableStock > 0);
        if (firstAvailable) {
            selectVariant(firstAvailable.id);
        } else if (variants.length > 0) {
            const btn = document.getElementById('btn-add-cart');
            btn.textContent = 'Hết hàng';
            btn.disabled = true;
        }
        
        updateCartCount();
    }

    function selectVariant(id) {
        selectedVariantId = id;
        document.querySelectorAll('.variant-card').forEach(c => c.classList.remove('active'));
        document.getElementById('var-' + id).classList.add('active');
        
        const btn = document.getElementById('btn-add-cart');
        btn.disabled = false;
        btn.textContent = '🛒 Thêm vào giỏ hàng';
    }

    async function addToCart() {
        if (!selectedVariantId) return;
        if (!isAuthenticated) {
            showToast('⚠️ Vui lòng đăng nhập để thêm vào giỏ hàng', 'error');
            setTimeout(() => window.location.href = '/login', 1500);
            return;
        }

        const qty = parseInt(document.getElementById('qty-input').value) || 1;
        const btn = document.getElementById('btn-add-cart');
        btn.disabled = true;
        btn.textContent = 'Đang thêm...';

        try {
            const res = await fetch('/api/v1/cart/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ variantId: selectedVariantId, quantity: qty })
            });
            const data = await res.json();
            if (data.success) {
                showToast(`✅ Đã thêm vào giỏ hàng!`, 'success');
                updateCartCount();
                // Optionally reload to update stock numbers locally
                loadProductDetail();
            } else {
                showToast('❌ ' + (data.message || 'Không thể thêm vào giỏ'), 'error');
            }
        } catch (e) {
            showToast('❌ Lỗi kết nối', 'error');
        }
        
        btn.disabled = false;
        btn.textContent = '🛒 Thêm vào giỏ hàng';
    }

    async function updateCartCount() {
        if (!isAuthenticated) return;
        try {
            const res = await fetch('/api/v1/cart');
            const data = await res.json();
            if (data.success) {
                const count = (data.data.items || []).length;
                const badge = document.getElementById('cart-count');
                badge.textContent = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            }
        } catch (e) {}
    }

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + type;
        setTimeout(() => t.className = 'toast', 3000);
    }

    loadProductDetail();
</script>
</body>
</html>
