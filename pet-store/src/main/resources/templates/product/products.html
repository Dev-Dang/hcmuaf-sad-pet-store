<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - Pet Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body>

<header th:replace="~{fragments/navigation :: customerHeader('products')}"></header>

<!-- ── Page ── -->
<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">🐾 Sản phẩm</h1>
        <p class="page-subtitle">Khám phá các sản phẩm tuyệt vời cho thú cưng của bạn</p>
    </div>

    <!-- Sidebar Categories -->
    <aside class="sidebar">
        <h3 class="sidebar-title">Danh mục</h3>
        <ul class="category-list" id="category-list">
            <li class="category-item active" onclick="selectCategory(null)">Tất cả sản phẩm</li>
            <!-- Rendered by JS -->
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Search -->
        <div class="search-bar">
            <input type="text" id="search-input" class="search-input"
                   placeholder="Tìm kiếm theo tên sản phẩm..." onkeydown="if(event.key==='Enter') doSearch()">
            <button class="btn-search" onclick="doSearch()">🔍 Tìm kiếm</button>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="products-grid">
            <div class="state-box">
                <div class="icon">⏳</div>
                <p>Đang tải sản phẩm...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </main>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script th:inline="javascript">
    const fmt = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);
    const icons = ['🐶','🐱','🐠','🐹','🦜','🐰','🦴','🐾','🐕','🐈','🦎','🐇'];
    const isAuthenticated = /*[[${session.currentUser != null}]]*/ false;

    let currentPage = 0;
    let currentKeyword = '';
    let currentCategoryId = null;

    async function loadCategories() {
        try {
            const res = await fetch('/api/v1/categories');
            const data = await res.json();
            if (data.success) {
                const list = document.getElementById('category-list');
                const html = `<li class="category-item ${currentCategoryId === null ? 'active' : ''}" onclick="selectCategory(null)">Tất cả sản phẩm</li>` +
                    data.data.map(c => `
                        <li class="category-item ${currentCategoryId === c.id ? 'active' : ''}" 
                            onclick="selectCategory(${c.id})">${c.name}</li>
                    `).join('');
                list.innerHTML = html;
            }
        } catch (e) {
            console.error('Lỗi tải danh mục', e);
        }
    }

    function selectCategory(id) {
        currentCategoryId = id;
        currentKeyword = ''; // Reset search khi chọn category
        document.getElementById('search-input').value = '';
        currentPage = 0;
        loadCategories(); // Re-render để active màu
        loadProducts();
    }

    async function loadProducts() {
        const grid = document.getElementById('products-grid');
        grid.innerHTML = '<div class="state-box"><div class="icon">⏳</div><p>Đang tải...</p></div>';

        try {
            let url = `/api/v1/products?page=${currentPage}&size=8&sort=id,asc`;
            if (currentKeyword) {
                url += `&keyword=${encodeURIComponent(currentKeyword)}`;
            } else if (currentCategoryId) {
                url += `&categoryId=${currentCategoryId}`;
            }
            
            const res = await fetch(url);
            const data = await res.json();
            if (data.success) renderProducts(data.data, currentPage);
            else grid.innerHTML = '<div class="state-box"><div class="icon">❌</div><p>Không tìm thấy sản phẩm nào</p></div>';
        } catch (e) {
            grid.innerHTML = '<div class="state-box"><div class="icon">❌</div><p>Không thể tải sản phẩm. Vui lòng thử lại!</p></div>';
            console.error(e);
        }
    }

    function renderProducts(page, currentPageNum) {
        const grid = document.getElementById('products-grid');
        const products = page.content || [];

        if (products.length === 0) {
            grid.innerHTML = '<div class="state-box"><div class="icon">🔍</div><p>Không tìm thấy sản phẩm nào</p></div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        grid.innerHTML = products.map((p, idx) => {
            // Find lowest price to display
            let lowestPrice = 0;
            if (p.variants && p.variants.length > 0) {
                lowestPrice = Math.min(...p.variants.map(v => v.price));
            }
            
            const priceHtml = lowestPrice > 0 ? `Từ ${fmt(lowestPrice)}` : 'Chưa có giá';

            return `
                <a href="/products/${p.id}" class="product-card">
                    <div class="product-image">${icons[(idx + currentPageNum * 8) % icons.length]}</div>
                    <div class="product-body">
                        <div class="product-name">${p.name || 'Sản phẩm'}</div>
                        <div class="product-desc">${p.description || ''}</div>
                        <div class="product-price">${priceHtml}</div>
                        <div class="btn-view">Xem chi tiết &rarr;</div>
                    </div>
                </a>`;
        }).join('');

        renderPagination(page, currentPageNum);
        updateCartCount();
    }

    function renderPagination(page, current) {
        const el = document.getElementById('pagination');
        const total = page.totalPages || 1;
        if (total <= 1) { el.innerHTML = ''; return; }
        let html = `<button class="page-btn" onclick="changePage(${current - 1})" ${current === 0 ? 'disabled' : ''}>‹</button>`;
        for (let i = 0; i < total; i++) {
            html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i + 1}</button>`;
        }
        html += `<button class="page-btn" onclick="changePage(${current + 1})" ${current >= total - 1 ? 'disabled' : ''}>›</button>`;
        el.innerHTML = html;
    }

    function changePage(p) {
        currentPage = p;
        loadProducts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function doSearch() {
        currentKeyword = document.getElementById('search-input').value.trim();
        currentCategoryId = null; // Reset category khi search
        currentPage = 0;
        loadCategories(); // Remove active category
        loadProducts();
    }

    async function updateCartCount() {
        if (!isAuthenticated) return;
        try {
            const res = await fetch('/api/v1/cart');
            const data = await res.json();
            if (data.success) {
                const count = (data.data.items || []).length;
                const badge = document.getElementById('cart-count');
                badge.textContent = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            }
        } catch (e) {}
    }

    loadCategories();
    loadProducts();
</script>
</body>
</html>
